<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Browser TI-agent</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label class="container" style="margin-top: 15px;">Включить оповещения
      <input type="checkbox" id="toggleWarnings" checked>
      <span class="checkmark-bl"></span>
    </label>
    <fieldset class="fieldset" id="rcFieldset">
      <legend class="legend">Используемые ресурсы</legend>
        <label class="container">VirusTotal
          <input id="vt" type="checkbox" checked>
          <span class="checkmark"></span>
        </label>
        <label class="container">Kaspersky
          <input id="kp" type="checkbox" checked>
          <span class="checkmark"></span>
        </label>
    </fieldset>
    <button class="whiteList" id="whiteList">➕ Добавить в белый список</button>

    <script src="popup.js"></script>

    <!--
      This HTML file opens when you click on icon from the toolbar.

      To begin the development, run `npm run watch`.
      To create a production bundle, use `npm run build`.
    -->
  </body>
</html>
